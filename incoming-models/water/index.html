<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#122a34"><title>Афина · Акватория</title><meta name="description" content="Интерактивный прототип акватории на Babylon.js с FFT-волнами, отражениями и контейнерным судном."><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Cpath fill='%233ee5d0' d='M20 2 38 34H2z'/%3E%3Cpath fill='%23152c36' d='m20 12 10 18H10z'/%3E%3C/svg%3E"><link rel="stylesheet" href="style.css"></head><body>
<canvas id="scene" aria-label="Трёхмерная акватория с контейнерным судном. Перетаскивайте для поворота, колёсико для приближения."></canvas>
<header><div class="brand"><svg viewBox="0 0 40 40" width="32" height="32" aria-hidden="true"><path d="M20 4 36 33H4Z" fill="none" stroke="currentColor" stroke-width="2"/><path d="m20 16 9 17H11Z" fill="currentColor"/></svg><span>АФИНА<small>АКВАТОРИЯ</small></span></div><span class="prototype"><i></i> ИНТЕРАКТИВНЫЙ ПРОТОТИП</span><div class="header-actions"><button id="pause" title="Приостановить волны" aria-label="Приостановить волны">Ⅱ</button><button id="settings-toggle" aria-expanded="true" aria-controls="settings" title="Параметры воды">Настройки <span>☷</span></button></div></header>
<aside id="settings"><div class="panel-head"><span>Состояние акватории</span><span class="live-dot"></span></div><div class="presets" aria-label="Волнение"><button data-preset="calm">Штиль</button><button data-preset="harbor" class="active">Гавань</button><button data-preset="sea">Море</button></div><label class="range-label" for="wind">Ветер <output id="wind-value">5,8 м/с</output></label><input type="range" id="wind" min="2" max="14" step="0.2" value="5.8"><label class="range-label" for="waves">Высота волн <output id="waves-value">38%</output></label><input type="range" id="waves" min="0.04" max="1.4" step="0.02" value="0.38"><div class="divider"></div><div class="switch-row"><label for="reflections">Отражения</label><input id="reflections" type="checkbox" checked role="switch"></div><div class="switch-row"><label for="foam">Пена</label><input id="foam" type="checkbox" checked role="switch"></div><div class="lighting"><button id="day" class="active">День</button><button id="sunset">Тёплый свет</button></div><label class="quality-row" for="quality"><span>Качество</span><select id="quality"><option value="balanced">Сбалансированное</option><option value="high">Высокое</option><option value="low">Лёгкое</option></select></label></aside>
<div class="scene-caption"><span class="eyebrow">ПОРТОВАЯ АКВАТОРИЯ</span><h1>Вода, которая живёт.</h1><p id="view-description">Волны, свет и отражения в единой сцене.</p></div>
<nav class="camera-bar" aria-label="Ракурс камеры"><button data-view="port" class="active"><span>◈</span> Обзор порта</button><button data-view="ship"><span>▱</span> У судна</button><button data-view="water"><span>≈</span> У воды</button><button data-view="aerial"><span>⌖</span> Сверху</button></nav>
<footer><span><i class="status-dot"></i><span id="status">Подготовка сцены</span></span><span class="hint">Вращение — мышью · Приближение — колёсиком</span><a href="athena-water-prototype.zip" download>Исходники ↓</a><span id="fps">—</span></footer>
<div id="loading" role="status"><div class="loader-mark">А</div><h2>Открываем акваторию</h2><p id="load-message">Загрузка сцены и модели судна…</p><div class="progress"><span id="load-progress"></span></div></div>
<div id="error" hidden role="alert"><h2>Не удалось запустить сцену</h2><p id="error-message"></p><button onclick="location.reload()">Повторить</button></div>
<script src="assets/babylon.js"></script><script src="assets/babylonjs.loaders.min.js"></script><script type="module" src="app.js"></script></body></html>
